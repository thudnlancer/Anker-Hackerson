[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-explain"
version = "0.1.0"
description = "Evidence-based energy decision explanations, independent of control"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1",
  "numpy>=1.26,<3", "scipy>=1.13,<2", "pandas>=2.1,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
energy-explain = "energy_explain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"energy_explain.strategy_vendor" = ["provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
