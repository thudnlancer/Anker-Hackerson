name: Strategy and explainability

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            explainability-app/requirements.lock
            explainability-app/requirements.shared.lock
      - run: python -m pip install -r explainability-app/requirements.lock -r explainability-app/requirements.shared.lock
      - run: python -m pip install --no-deps -e explainability-app
      - name: Dependency integrity
        run: python -m pip check
      - name: Strategy, online safety, and evidence tests
        run: python -m pytest tests -q
        env:
          PYTHONPATH: src
      - name: Local documentation links
        run: python scripts/maintenance/check_doc_links.py
      - name: Explanation service and shared model replay
        working-directory: explainability-app
        run: python -m pytest -q
        env:
          PYTHONPATH: src:../src
      - name: Read-only browser-terminal deployment preflight
        run: python scripts/maintenance/deployment_preflight.py --expected-commit "$(git rev-parse HEAD)" --output outputs/ci_deployment_preflight.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explainability-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: explainability-app/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
